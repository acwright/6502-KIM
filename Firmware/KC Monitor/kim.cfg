# ***                    ***
# ***     KIM CONFIG     ***
# ***                    ***
#
# Linker config for the 6502-KIM Keypad Card cartridge (KC Monitor).
#
# The Keypad Card overlays $C000-$FFFF, so this is NOT the family-wide 32 KB
# BIOS layout: there is no BASIC, no Monitor and no Wozmon in this image.
# The cartridge is a single AT28C64 (8 KB) holding ROM at $E000-$FFF9 with
# the CPU vectors at $FFFA-$FFFF.  The PIA register space ($C000-$DFFF) is
# I/O, not ROM, so nothing is emitted for it.

MEMORY {
  ROM:      start=$E000, size=$1FFA, file="%O", fill=yes, fillval=$00;
  VECTORS:  start=$FFFA, size=$0006, file="%O", fill=yes, fillval=$00;
}

SEGMENTS {
  ROM:            load=ROM,           type=ro;
  VECTORS:        load=VECTORS,       type=ro;
}