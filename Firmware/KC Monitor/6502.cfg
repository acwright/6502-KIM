# ***                     ***
# ***     6502 CONFIG     ***
# ***                     ***
#
# KC Monitor cartridge ROM image (AT28C64, 8 KB).
# ROM occupies $E000-$FFF9; the CPU vectors sit at $FFFA-$FFFF.
# The PIA register space ($C000-$DFFF) is I/O, not ROM, so it is not
# emitted here.

MEMORY {
  ROM:      start=$E000, size=$1FFA, file="%O", fill=yes, fillval=$00;
  VECTORS:  start=$FFFA, size=$0006, file="%O", fill=yes, fillval=$00;
}

SEGMENTS {
  ROM:            load=ROM,           type=ro;
  VECTORS:        load=VECTORS,       type=ro;
}